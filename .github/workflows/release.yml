name: Release

on:
  release:
    types: [published]

# Every job declares the permissions it needs and nothing more.
permissions: {}

# One release publishes at a time: a release published while another runs waits for it. GitHub
# keeps only one waiting run per group, so a third release cancels the waiting one, and that
# cancelled release does not publish until someone re-runs its workflow by hand.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    # Forks never publish; the publish jobs repeat this guard.
    if: github.repository == 'ogarciarevett/jev-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.dist-tag.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Third-party actions are pinned to commit SHAs; the release tag is kept as a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # The publish jobs check out this exact commit, never the tag name again.
      - name: Record the verified commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      # Refuses a tag that is not v<package.json version>, a version outside X.Y.Z and
      # X.Y.Z-(alpha|beta|rc).N, and a pre-release flag that disagrees with the version.
      - name: Resolve the npm dist-tag
        id: dist-tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release-tag.ts "$TAG" "$(jq -r .version package.json)" "$PRERELEASE"

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build

      - name: Test, with the Node package smoke test required
        run: bun test
        env:
          JEV_REQUIRE_NODE_SMOKE: "1"

  npm:
    name: Publish to npm
    needs: verify
    if: github.repository == 'ogarciarevett/jev-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # The bytes published are the verified commit either way; a moved tag would only make the
      # GitHub release describe other code, so it stops the publish.
      - name: Refuse a tag that moved after verification
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERIFIED: ${{ needs.verify.outputs.sha }}
        run: |
          current="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n 1 | cut -f 1)"
          if [ "$current" != "$VERIFIED" ]; then
            echo "::error::tag ${TAG} now points at ${current:-nothing}, not the verified ${VERIFIED}"
            exit 1
          fi

      # `npm publish` runs `prepack`, which builds with the TypeScript devDependency.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Require npm 11.5.1 or newer for trusted publishing
        run: |
          required=11.5.1
          actual="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$actual" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm ${actual} is older than ${required}, the first with trusted publishing"
            exit 1
          fi

      # A re-run after a partial release skips a registry that already has the version. Only
      # npm's E404 counts as absent; an auth or network error fails here (scripts/registry-version.ts).
      - name: Check whether npm already has this version
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/registry-version.ts

      # How npm authenticates here (https://docs.npmjs.com/trusted-publishers, and npm CLI
      # lib/utils/oidc.js, https://github.com/npm/cli/blob/v11.19.0/lib/utils/oidc.js): in GitHub
      # Actions with `id-token: write`, npm first exchanges the workflow's OIDC token for a
      # short-lived publish token for this package and uses it in place of any configured token.
      # Only when that exchange fails, as it does before the package exists on npm with a trusted
      # publisher for this workflow, does npm fall back to NODE_AUTH_TOKEN. The optional NPM_TOKEN
      # secret is therefore a first-publish bootstrap: once the trusted publisher is configured on
      # npmjs.com, OIDC wins on every run and the secret should be deleted. A trusted publish of
      # this public repository gets provenance automatically; `--provenance` also attests the
      # bootstrap publish.
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"

      - name: Skip a version npm already has
        if: steps.registry.outputs.published == 'true'
        run: echo "::notice title=npm::This version is already on npm; nothing was published."

  github-packages:
    name: Publish to GitHub Packages
    needs: verify
    if: github.repository == 'ogarciarevett/jev-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Refuse a tag that moved after verification
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERIFIED: ${{ needs.verify.outputs.sha }}
        run: |
          current="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n 1 | cut -f 1)"
          if [ "$current" != "$VERIFIED" ]; then
            echo "::error::tag ${TAG} now points at ${current:-nothing}, not the verified ${VERIFIED}"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # The scope sends @ogarciarevett packages to GitHub Packages; `repository` in package.json
      # links the package to this repository.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: "@ogarciarevett"

      # Same token as the publish, so the check sees what the publish would.
      - name: Check whether GitHub Packages already has this version
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/registry-version.ts

      - name: Publish
        if: steps.registry.outputs.published == 'false'
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --tag "$DIST_TAG"

      - name: Skip a version GitHub Packages already has
        if: steps.registry.outputs.published == 'true'
        run: echo "::notice title=GitHub Packages::This version is already there; nothing was published."
