name: Release

on:
  release:
    types: [published]

# Every job declares the permissions it needs and nothing more.
permissions: {}

# One release publishes at a time. A release published while another runs waits for it; GitHub
# keeps one waiting run per group, so a third release cancels the waiting one, which is re-run.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    # Forks never publish; the publish jobs repeat this guard.
    if: github.repository == 'ogarciarevett/jev-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.dist-tag.outputs.tag }}
    steps:
      # Third-party actions are pinned to commit SHAs; the release tag is kept as a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      # Refuses a tag that is not v<package.json version>, a version outside X.Y.Z and
      # X.Y.Z-(alpha|beta|rc).N, and a pre-release flag that disagrees with the version.
      - name: Resolve the npm dist-tag
        id: dist-tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release-tag.ts "$TAG" "$(jq -r .version package.json)" "$PRERELEASE"

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build

      - name: Test, with the Node package smoke test required
        run: bun test
        env:
          JEV_REQUIRE_NODE_SMOKE: "1"

  npm:
    name: Publish to npm
    needs: verify
    if: github.repository == 'ogarciarevett/jev-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # `npm publish` runs `prepack`, which builds with the TypeScript devDependency.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Require npm 11.5.1 or newer for trusted publishing
        run: |
          required=11.5.1
          actual="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$actual" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm ${actual} is older than ${required}, the first with trusted publishing"
            exit 1
          fi

      # How npm authenticates here (https://docs.npmjs.com/trusted-publishers, and npm CLI
      # lib/utils/oidc.js, https://github.com/npm/cli/blob/v11.19.0/lib/utils/oidc.js): in GitHub
      # Actions with `id-token: write`, npm first exchanges the workflow's OIDC token for a
      # short-lived publish token for this package and uses it in place of any configured token.
      # Only when that exchange fails, as it does before the package exists on npm with a trusted
      # publisher for this workflow, does npm fall back to NODE_AUTH_TOKEN. The optional NPM_TOKEN
      # secret is therefore a first-publish bootstrap: once the trusted publisher is configured on
      # npmjs.com, OIDC wins on every run and the secret should be deleted. A trusted publish of
      # this public repository gets provenance automatically; `--provenance` also attests the
      # bootstrap publish.
      - name: Publish
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"

  github-packages:
    name: Publish to GitHub Packages
    needs: verify
    if: github.repository == 'ogarciarevett/jev-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # The scope sends @ogarciarevett packages to GitHub Packages; `repository` in package.json
      # links the package to this repository.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: "@ogarciarevett"

      - name: Publish
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --tag "$DIST_TAG"
